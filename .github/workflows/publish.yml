name: French Word of the Day

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: french-vocab-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and color emoji font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - run: pip install -r requirements.txt

      - name: Build and publish today's word
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publish.py

      - name: Commit progress only
        if: always()
        run: |
          git config user.name "french-vocab-bot"
          git config user.email "bot@users.noreply.github.com"
          rm -f word_video.mp4
          git add progress.json history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "progress update"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
